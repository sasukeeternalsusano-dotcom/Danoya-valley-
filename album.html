<style>html{background:#1a0c24}*{box-sizing:border-box}
:root{--bg:#1a0c24;--fg:#fff4e8;--mut:#d9b8e8;--card:#2a1438;--line:#ffffff30;--acc:#ff9ec0}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.w{max-width:760px;margin:0 auto}
h1{font-family:Bungee,sans-serif;font-size:1.6rem;margin:6px 0 2px;text-wrap:balance}
.sub{font-family:Caveat,cursive;font-size:1.4rem;color:var(--mut);margin:0 0 14px}
a.back{display:inline-block;color:var(--fg);font-weight:800;text-decoration:none;border:2px solid var(--line);border-radius:99px;padding:8px 16px;margin-bottom:10px}
h2{font-family:Bungee,sans-serif;font-size:1rem;letter-spacing:.04em;color:var(--acc);margin:26px 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 8px 10px;cursor:pointer;min-width:0;text-align:left;color:inherit;font:inherit;transform:rotate(var(--r,0deg))}
.c img,.c .ph{width:100%;aspect-ratio:5/6;object-fit:cover;display:block;border-radius:3px;background:#12081a}
.c .ph{display:grid;place-items:center;font-family:Bungee,sans-serif;font-size:2rem;color:#ffffff40}
.c b{display:block;font-family:Caveat,cursive;font-size:1.25rem;margin-top:6px;line-height:1.1}
.c small{display:block;color:var(--mut);font-size:.72rem;margin-top:2px}
.lock{cursor:default}
.lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:18px;z-index:9}
.lb.on{display:grid}
.lb div{max-width:min(420px,100%);background:var(--card);padding:12px;border-radius:8px;text-align:center}
.lb img{max-width:100%;max-height:68vh;border-radius:4px}
.lb b{display:block;font-family:Caveat,cursive;font-size:1.6rem;margin-top:8px}
.lb p{margin:4px 0 0;color:var(--mut)}
</style>
